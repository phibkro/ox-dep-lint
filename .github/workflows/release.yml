# Publishes to npm when a version tag is pushed. The `release` environment only admits `v*` tags, so only this job can
# read its NPM_TOKEN. Once the package exists, npm's trusted publishing (OIDC, `id-token: write`) replaces the token:
# configure repository phibkro/ox-dep-lint, workflow release.yml, environment release on npmjs.com, then delete the secret.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.21.0
      - run: bun install --frozen-lockfile
      - name: The tag names the version in package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun run check
      - run: bun run build
      # A prerelease (0.2.0-beta.1) goes to the `next` dist-tag, so `latest` only ever names a release.
      - run: npm publish --provenance --access public --tag "$(case "$GITHUB_REF_NAME" in *-*) echo next ;; *) echo latest ;; esac)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
