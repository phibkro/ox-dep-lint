name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      # The tarball must carry the built files (0.1.0 went out without them).
      - name: The package holds dist
        run: npm pack --dry-run --json --ignore-scripts | node -e 'const [pack] = JSON.parse(require("fs").readFileSync(0, "utf8")); for (const file of ["dist/cli.mjs", "dist/index.mjs", "dist/plugin.mjs", "dist/index.d.mts"]) { if (!pack.files.some((entry) => entry.path === file)) { console.error(`missing ${file}`); process.exit(1) } }'
